name: Static analysis

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  emmylua-check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-emmylua-analyzer

      - name: Run emmylua_check
        run: emmylua_check --config .emmyrc.json .
